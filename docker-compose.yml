services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      # Required: Your external PostgreSQL database URL
      - DATABASE_URL=${DATABASE_URL}
      
      # Required: Midtrans configuration
      - MIDTRANS_SERVER_KEY=${MIDTRANS_SERVER_KEY}
      - MIDTRANS_CLIENT_KEY=${MIDTRANS_CLIENT_KEY}
      - MIDTRANS_IS_PRODUCTION=${MIDTRANS_IS_PRODUCTION:-false}
      
      # Optional: Gemini API key (if using AI features)
      - GEMINI_API_KEY=${GEMINI_API_KEY}

      # Admin login (also gates MCP OAuth consent)
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # MCP + OAuth (optional)
      - APP_URL=${APP_URL}
      - MCP_OAUTH_ISSUER=${MCP_OAUTH_ISSUER}
      - MCP_OAUTH_CLIENT_ID=${MCP_OAUTH_CLIENT_ID}
      - MCP_OAUTH_CLIENT_SECRET=${MCP_OAUTH_CLIENT_SECRET}
      - MCP_OAUTH_SIGNING_SECRET=${MCP_OAUTH_SIGNING_SECRET}
      - MCP_OAUTH_REDIRECT_URIS=${MCP_OAUTH_REDIRECT_URIS}
      - MCP_OAUTH_TOKEN_EXPIRY=${MCP_OAUTH_TOKEN_EXPIRY:-3600}
      - MCP_OAUTH_DCR_ENABLED=${MCP_OAUTH_DCR_ENABLED:-false}
      - MCP_STATIC_TOKEN=${MCP_STATIC_TOKEN}

      # Production mode
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/config"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    restart: unless-stopped
